services:
  app:
    image: ghcr.io/amzoeee/calendar_v3:latest
    restart: unless-stopped
    ports:
      # Bound to localhost only — public access goes through Caddy on 443.
      - "127.0.0.1:4000:4000"
    env_file:
      - .env
    environment:
      - DATABASE_PATH=/app/data/calendar.db
      - BACKUP_DIR=/backups
    volumes:
      - calendar-data:/app/data
      # Database backups (see README). Deliberately a host path rather than a
      # docker volume: it lives outside the app folder and outside the volume
      # holding the live database, so it survives `docker compose down -v`.
      # The host directory must be writable by uid 1001 (the container user).
      - ${BACKUP_HOST_DIR:?set BACKUP_HOST_DIR in .env - see .env.example}:/backups
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # Terminates HTTPS and auto-manages a Let's Encrypt cert for the
  # app's hostname (see Caddyfile), proxying to it over the internal
  # docker network.
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

  # Keeps calendar.geodesync.com's Cloudflare DNS record pointed at this
  # network's current public IP, since home internet IPs change.
  cloudflare-ddns:
    image: favonia/cloudflare-ddns:latest
    restart: unless-stopped
    environment:
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      - DOMAINS=calendar.geodesync.com
      - PROXIED=false

  # Polls GHCR for a newer `app` image and redeploys it automatically.
  # Scoped to labeled containers only via --label-enable, so it won't
  # touch anything else running on the host.
  # containrrr/watchtower was archived (Dec 2025) and its stale bundled
  # Docker client stopped working against newer Docker Engine versions
  # ("client version too old") — nicholas-fedor/watchtower is the
  # actively maintained continuation.
  watchtower:
    image: ghcr.io/nicholas-fedor/watchtower:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 300 --label-enable --cleanup

volumes:
  calendar-data:
  caddy-data:
  caddy-config:
